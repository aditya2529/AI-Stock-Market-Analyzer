name: Paper Trading — Market Hours

on:
  schedule:
    # Runs every hour during NSE market hours (Mon–Fri)
    # 4:05 UTC  = 9:35 AM IST  (30 min after open)
    # 5:05 UTC  = 10:35 AM IST
    # 6:05 UTC  = 11:35 AM IST
    # 7:05 UTC  = 12:35 PM IST
    # 8:05 UTC  = 1:35 PM IST
    # 9:05 UTC  = 2:35 PM IST
    # 10:05 UTC = 3:35 PM IST  (just after close — final signal of the day)
    - cron: "5 4-10 * * 1-5"
  workflow_dispatch:  # manual trigger from GitHub UI anytime

jobs:
  paper-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-deploy.txt

      - name: Restore database and model from previous run
        uses: actions/cache@v4
        with:
          path: |
            market_data.db
            models/saved/ensemble.pkl
          key: paper-trading-data-${{ github.run_number }}
          restore-keys: |
            paper-trading-data-

      - name: Run paper trading pass
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_FROM:     ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_MIN_CONFIDENCE: "0.55"
          DATA_ADAPTER: "yfinance"
        run: python main.py paper --once

      - name: Save updated database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            market_data.db
            models/saved/ensemble.pkl
          key: paper-trading-data-${{ github.run_number }}
