name: Monthly Model Retrain

on:
  schedule:
    # 01:30 UTC = 07:00 IST, 1st of every month
    - cron: "30 1 1 * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-deploy.txt

      - name: Restore existing database
        uses: actions/cache@v4
        with:
          path: |
            market_data.db
            models/saved/ensemble.pkl
          key: paper-trading-data-retrain-${{ github.run_number }}
          restore-keys: |
            paper-trading-data-

      - name: Fetch fresh data (all 25 NSE symbols + Nifty/VIX)
        env:
          DATA_ADAPTER: "yfinance"
        run: |
          python main.py fetch --market nse --years 10
          python main.py fetch --symbol ^NSEI,^INDIAVIX --years 10

      - name: Retrain ensemble model
        run: python main.py train --all

      - name: Run backtest to verify model quality
        run: python main.py backtest --symbol RELIANCE.NS --save

      - name: Save retrained model and database
        uses: actions/cache/save@v4
        with:
          path: |
            market_data.db
            models/saved/ensemble.pkl
          key: paper-trading-data-retrain-${{ github.run_number }}

      - name: Upload backtest report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report-${{ github.run_number }}
          path: backtest_report.json
          retention-days: 90
